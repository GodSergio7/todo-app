<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Calendario</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../estilos/estilos-globales.css">
  <link rel="stylesheet" href="calendario.css">
</head>
<body>
  <div class="bg-glow"></div>

  <div class="container container-calendar">
    <header class="app-header">
      <div class="nav-montaje" data-nav-montaje data-activa="calendario"></div>

      <h1>Calendario</h1>
    </header>

    <main class="app-body">
      <div class="reloj-montaje" data-reloj-montaje></div>

      <section class="calendar-section" aria-label="Calendario mensual">
        <div class="cal-header">
          <button type="button" class="cal-nav-btn" id="prev-month" aria-label="Mes anterior">‹</button>
          <div class="cal-title">
            <span id="month-title">—</span>
            <span id="month-year">—</span>
          </div>
          <button type="button" class="cal-nav-btn" id="next-month" aria-label="Mes siguiente">›</button>
        </div>

        <div class="cal-toolbar">
          <button type="button" class="cal-today-btn" id="today-btn">Ir al mes actual</button>
          <div class="cal-legend" aria-hidden="true">
            <span class="legend-item"><span class="legend-dot dot-pending"></span> Pendiente</span>
            <span class="legend-item"><span class="legend-dot dot-done"></span> Completada</span>
          </div>
        </div>

        <div class="cal-weekdays" aria-hidden="true">
          <span>Lun</span><span>Mar</span><span>Mié</span><span>Jue</span>
          <span>Vie</span><span>Sáb</span><span>Dom</span>
        </div>

        <div class="cal-grid" id="calendar-grid"></div>
      </section>

      <div id="cal-legend-mobile" class="cal-legend-mobile" hidden>
        <span class="legend-item"><span class="legend-dot dot-pending"></span> Pendiente</span>
        <span class="legend-item"><span class="legend-dot dot-done"></span> Completada</span>
      </div>

      <div id="cal-empty-note" class="cal-empty-note" hidden>
        No hay tareas con fecha límite para este mes.
      </div>
    </main>
  </div>

  <!-- Modal de detalle de tarea -->
  <div class="modal-backdrop" id="modal-backdrop" hidden>
    <div class="modal-card" role="dialog" aria-modal="true" aria-labelledby="modal-task-name">
      <button type="button" class="modal-close" id="modal-close" aria-label="Cerrar">×</button>
      <h2 class="modal-title" id="modal-task-name"></h2>
      <dl class="modal-meta">
        <div class="modal-meta-row">
          <dt>Fecha límite</dt>
          <dd id="modal-due-date">—</dd>
        </div>
        <div class="modal-meta-row">
          <dt>Estado</dt>
          <dd id="modal-status">—</dd>
        </div>
      </dl>
      <div class="modal-actions">
        <button type="button" class="cal-action-btn" id="modal-toggle">Marcar como completada</button>
        <button type="button" class="btn-delete" id="modal-delete">Eliminar</button>
      </div>
    </div>
  </div>

  <script src="../datos/almacenamiento.js"></script>
  <script src="../componentes/aviso/aviso.js"></script>
  <script src="../componentes/navegacion/navegacion.js"></script>
  <script src="../componentes/reloj/reloj.js"></script>
  <script src="calendario.js"></script>
</body>
</html>
